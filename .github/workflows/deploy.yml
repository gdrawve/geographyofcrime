# Builds the site and publishes it to GitHub Pages on every push
# to main. You never run this by hand: push a change, wait about a
# minute, and the live site updates.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Video thumbnails are saved to the site so pages never contact
      # YouTube before someone presses play.
      - name: Video thumbnails
        run: node scripts/fetch_thumbs.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Share images (Open Graph cards) for every page, drawn into dist/og/.
      - name: Share images
        run: node scripts/og.mjs
      # Accessibility gate: serious WCAG problems stop the deploy.
      - name: Accessibility check
        run: |
          npm run a11y > a11y.log 2>&1 || {
            echo "::error::$(tail -n 25 a11y.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
