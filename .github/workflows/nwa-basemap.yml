# Builds the base maps behind the site's static map graphics from Census
# TIGER/Line data: central Kansas City (home-page hex graphic) and
# Northwest Arkansas (About page). Run by hand (Actions → "Build graphic
# base maps" → Run workflow); roads rarely change.
name: Build graphic base maps

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely==2.0.6 pyshp==2.3.1
      - name: Build base maps
        run: |
          { python scripts/build_nwa.py && python scripts/build_kc_basemap.py; } 2> err.log || {
            echo "::error::$(tail -n 20 err.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }
          grep Wrote err.log | while IFS= read -r line; do echo "::notice::$line"; done
      - name: Commit, then deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/data/nwa-basemap.json src/data/kc-basemap.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "geographyofcrime-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Build graphic base maps"
          git push
          gh workflow run deploy.yml --ref main
