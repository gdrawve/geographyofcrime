# Weekly crime-data refresh.
# Every Monday morning (Central time) this:
#   1. runs scripts/build_crime_grid.py to pull the latest two years (map shows 12 months),
#   2. commits the updated public/data/crime-grid.json if it changed,
#   3. starts the deploy workflow so the live site picks it up.
# If the city's API is down, the script exits early and the last good
# data stays live.
name: Refresh crime and research data

on:
  schedule:
    - cron: '17 11 * * 1'   # Mondays 11:17 UTC ≈ 6:17 am Central
  workflow_dispatch:         # adds a "Run workflow" button on GitHub

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install networkx==3.4.2 shapely==2.0.6 pyshp==2.3.1
      - name: Refresh publications from OpenAlex
        run: python scripts/build_research.py
      - name: Neighborhood names from OpenStreetMap
        run: python scripts/build_basemap.py || echo "::warning::Place names refresh failed; keeping the last ones"
      - name: Build grid from city API
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        # On failure, the last lines of the error are posted as
        # annotations so they show on the run's summary page.
        run: |
          python scripts/build_crime_grid.py 2> err.log || {
            # One annotation, newlines encoded, so nothing gets cut off.
            echo "::error::$(tail -n 20 err.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            exit 1
          }
          tail -n 12 err.log | while IFS= read -r line; do echo "::notice::$line"; done
      - name: Commit if changed, then deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stage first so brand-new files (like a first basemap) count.
          git add public/data/crime-grid.json public/data/crime-bg.json public/data/places.json src/data/research.json src/data/kc-stats.json
          if git diff --cached --quiet; then
            echo "No change in data."
            exit 0
          fi
          git config user.name "geographyofcrime-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refresh crime and research data ($(date -u +%Y-%m-%d))"
          git push
          # Pushes made by this workflow don't trigger other workflows,
          # so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
